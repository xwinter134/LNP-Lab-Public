<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LNP Lab</title>
<link rel="icon" type="image/png" href="app/assets/favicon.png">
<style>
  :root {
    --bg: #F5F5F7; --bg2: #EDEDF0; --sidebar: #ECECEE; --card: #FFFFFF; --input: #FFFFFF;
    --line: rgba(0,0,0,0.09); --line-strong: rgba(0,0,0,0.16); --sel: rgba(0,0,0,0.07); --hover: rgba(0,0,0,0.04);
    --ink: #1C1C1E; --ink2: #6E6E73; --ink3: #AEAEB2;
    --accent: #0A7AFF; --accent-soft: #E8F1FF; --accent-text: #0A5BC4;
    --ok: #34C759; --ok-text: #1E7B3A; --ok-soft: #E6F7EB;
    --warn: #FF9500; --warn-text: #8A4B00; --warn-soft: #FFF3E0; --warn-line: #FFD9A3;
    --danger: #FF3B30; --orange: #FF9500; --chip: #EFEFF2;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.05);
    --c-overview: #FFCC00; --c-calendar: #FF3B30; --c-experiments: #0A84FF; --c-batches: #5E5CE6; --c-stocks: #AF52DE;
    --c-buffers: #30B0C7; --c-process: #FF9500; --c-measurements: #34C759; --c-doe: #5856D6; --c-insights: #FF2D55; --c-ml: #BF5AF2;
    --c-advisor: #FF9F0A; --c-learn: #64D2FF; --c-fluidics: #8E8E93; --c-materials: #A2845E; --c-settings: #8E8E93;
    /* categorical series for charts, fixed order (validated light/dark steps; see app/ui/charts.js) */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --dark: 1; } }
  :root[data-theme="dark"] { --dark: 1; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1C1E; --bg2: #2A2A2D; --sidebar: #232326; --card: #2C2C2E; --input: #1C1C1E;
      --line: rgba(255,255,255,0.10); --line-strong: rgba(255,255,255,0.18); --sel: rgba(255,255,255,0.09); --hover: rgba(255,255,255,0.05);
      --ink: #F2F2F7; --ink2: #A1A1A6; --ink3: #636366;
      --accent: #0A84FF; --accent-soft: #1B3358; --accent-text: #79B8FF;
      --ok: #30D158; --ok-text: #7CE495; --ok-soft: #173A24;
      --warn: #FF9F0A; --warn-text: #FFC46B; --warn-soft: #3A2A10; --warn-line: #5A3F14;
      --danger: #FF453A; --orange: #FF9F0A; --chip: #3A3A3C;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1C1E; --bg2: #2A2A2D; --sidebar: #232326; --card: #2C2C2E; --input: #1C1C1E;
    --line: rgba(255,255,255,0.10); --line-strong: rgba(255,255,255,0.18); --sel: rgba(255,255,255,0.09); --hover: rgba(255,255,255,0.05);
    --ink: #F2F2F7; --ink2: #A1A1A6; --ink3: #636366;
    --accent: #0A84FF; --accent-soft: #1B3358; --accent-text: #79B8FF;
    --ok: #30D158; --ok-text: #7CE495; --ok-soft: #173A24;
    --warn: #FF9F0A; --warn-text: #FFC46B; --warn-soft: #3A2A10; --warn-line: #5A3F14;
    --danger: #FF453A; --orange: #FF9F0A; --chip: #3A3A3C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }

  /* color-mix() needs Safari 16.2, and the macOS app runs on the WKWebView of macOS 12, which is Safari 15. A plain value written before it
     would not help: a declaration holding var() is kept until the variables are filled in, and is dropped only then, taking the property
     with it. So each rule carries a plain value, the same tint laid over the same base, and the color-mix() follows it in an @supports block
     that an older engine skips (tests/compat.test.mjs checks this). */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif; color: var(--ink); background: var(--bg); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  .app { display: flex; min-height: 100vh; }

  /* ---------- sidebar ---------- */
  nav { width: 232px; flex: 0 0 232px; background: var(--sidebar); border-right: 1px solid var(--line); padding: 14px 10px 12px; display: flex; flex-direction: column; gap: 1px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav .brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 12px; font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
  nav .brand .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--c-experiments), var(--c-stocks)); display: inline-flex; align-items: center; justify-content: center; }
  nav .group { font-size: 11px; font-weight: 600; color: var(--ink3); letter-spacing: .06em; text-transform: uppercase; padding: 14px 10px 5px; }
  nav a.item { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 13.5px; min-height: 30px; transition: background .12s; }
  nav a.item:hover { background: var(--hover); }
  nav a.item.active { background: var(--sel); font-weight: 600; }
  nav a.item .ico { width: 18px; height: 18px; flex: 0 0 18px; display: inline-flex; align-items: center; justify-content: center; }
  nav a.item .ico svg { width: 18px; height: 18px; }
  nav a.item .lbl { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav a.item .badge { font-size: 11px; font-weight: 600; color: var(--ink2); background: var(--chip); border-radius: 999px; padding: 1px 7px; }
  nav a.item .badge.hot { background: var(--c-calendar); color: #fff; }
  nav a.sub { padding-left: 36px; font-size: 13px; min-height: 26px; color: var(--ink); }
  nav a.sub .ring { width: 14px; height: 14px; flex: 0 0 14px; }
  nav .foot { margin-top: auto; padding: 10px 6px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; font-size: 11.5px; }
  .seg button { border: 0; background: transparent; color: var(--ink2); padding: 4px 9px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 500; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); cursor: pointer; padding: 2px 4px; }
  .switch input { -webkit-appearance: none; appearance: none; width: 30px; height: 18px; border-radius: 999px; background: var(--ink3); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked { background: var(--ok); }
  .switch input:checked::after { left: 14px; }
  /* Demo mode is a different dataset, so it has to look like one from across the room. */
  body.demo nav { background: linear-gradient(rgba(191, 90, 242, .07), rgba(191, 90, 242, .07)), var(--sidebar); }
  @supports (color: color-mix(in srgb, red, red)) { body.demo nav { background: color-mix(in srgb, var(--c-ml) 7%, var(--sidebar)); } }
  .demo-chip { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; color: #fff; background: var(--c-ml); border-radius: 4px; padding: 2px 5px; margin-left: auto; }
  nav .foot .demo-note { font-size: 11px; color: var(--ink2); line-height: 1.35; }
  nav .foot .demo-note button { font: inherit; border: 0; background: none; color: var(--c-ml); padding: 0; cursor: pointer; text-decoration: underline; }
  nav .stats { font-size: 11px; color: var(--ink3); padding: 0 4px; line-height: 1.5; }
  /* Search at the top of the sidebar (app/ui/searchbox.js). Its results float over the page from the body,
     since the sidebar scrolls and would clip them. */
  .nav-search { position: relative; display: flex; align-items: center; margin: 0 2px 8px; }
  .nav-search svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--ink3); pointer-events: none; }
  .nav-search input { padding: 5px 52px 5px 29px; border-radius: 8px; font-size: 13px; }
  .nav-search input::-webkit-search-cancel-button { display: none; }
  .nav-search kbd { position: absolute; right: 7px; font-family: inherit; font-size: 10.5px; font-weight: 500; line-height: 1.4; color: var(--ink3); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; pointer-events: none; }
  .nav-search input:not(:placeholder-shown) ~ kbd { display: none; }
  .search-pop { position: fixed; z-index: 70; background: var(--card); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); max-height: min(70vh, 560px); overflow-y: auto; padding: 4px 6px 6px; }
  .search-pop .sr-head { display: flex; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); padding: 9px 8px 3px; }
  .search-pop .sr-head span { margin-left: auto; font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .search-pop a.sr-item { display: block; padding: 5px 8px; border-radius: 7px; color: var(--ink); text-decoration: none; }
  .search-pop a.sr-item.on { background: var(--accent-soft); }
  .search-pop .sr-title, .search-pop .sr-sub { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-pop .sr-title { font-size: 13px; font-weight: 500; }
  .search-pop .sr-mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .search-pop .sr-sub { font-size: 11.5px; color: var(--ink2); }
  .search-pop .sr-more, .search-pop .sr-empty { font-size: 12px; color: var(--ink2); padding: 3px 8px 4px; }
  .search-pop .sr-empty { padding: 10px 8px; }
  .search-pop .sr-keys { font-size: 11px; color: var(--ink3); padding: 8px 8px 2px; border-top: 1px solid var(--line); margin-top: 6px; }

  /* ---------- content ---------- */
  main { flex: 1 1 auto; min-width: 0; padding: 26px 32px 48px; max-width: 1480px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.005em; }
  .crumb { font-size: 12px; color: var(--ink2); margin-bottom: 10px; }
  /* A crumb is a path, so its parts link back up it; they should read as the trail and not as a row of buttons. */
  .crumb a { color: inherit; text-decoration: none; }
  .crumb a:hover { color: var(--ink); text-decoration: underline; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 12px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi { background: var(--bg2); border-radius: 10px; padding: 11px 13px; } .kpi .l { font-size: 11.5px; color: var(--ink2); } .kpi .v { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin-top: 1px; }
  label { display: block; font-size: 12px; color: var(--ink2); font-weight: 500; margin-bottom: 4px; }
  input, select, textarea { font: inherit; width: 100%; padding: 6px 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--input); color: var(--ink); min-height: 30px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); min-height: 0; }
  input.invalid { border-color: var(--warn); }
  /* the "?" explainer: a mark small enough to ignore and large enough to hit */
  button.learn { width: 17px; height: 17px; min-height: 0; padding: 0; border-radius: 50%; font-size: 11px; font-weight: 700;
    line-height: 1; border: 1px solid var(--line-strong); background: var(--bg2); color: var(--ink2); vertical-align: 1px; }
  button.learn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: transparent; }
  button.learn:disabled { opacity: .7; cursor: default; }
  button.learn-inline { padding: 0; min-height: 0; border: none; background: none; color: var(--accent); font: inherit;
    text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; cursor: pointer; }
  .learn-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.34); z-index: 60; }
  .learn-card { position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(620px, calc(100vw - 32px));
    max-height: min(82vh, 760px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .learn-head #learnBack { width: 26px; height: 26px; min-height: 0; padding: 0; border-radius: 7px; font-size: 17px; line-height: 1; flex: 0 0 auto; }
  .learn-head { position: sticky; top: 0; display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px 10px;
    background: var(--card); border-bottom: 1px solid var(--line); }
  .learn-head h2 { font-size: 18px; }
  .learn-group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
  .learn-body { padding: 14px 18px 18px; font-size: 14px; line-height: 1.62; }
  .learn-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); margin: 16px 0 4px; }
  .learn-body p { margin: 0; }
  table.learn-numbers { width: 100%; border-collapse: collapse; margin-top: 4px; }
  table.learn-numbers td { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  button.learn-tile { display: block; width: 100%; text-align: left; padding: 11px 13px; border-radius: 10px; height: auto;
    border: 1px solid var(--line); background: var(--bg2); }
  button.learn-tile:hover { border-color: var(--accent); background: var(--card); }
  .learn-tile-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; color: var(--ink); }
  .adv-steps { list-style: none; margin: 0 0 14px; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; }
  .adv-steps li { padding: 6px 12px; }
  .adv-card { display: block; width: 100%; text-align: left; height: auto; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: inherit; text-decoration: none; }
  .adv-card:hover { border-color: var(--c-advisor); background: var(--bg2); }
  .adv-card-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
  /* The three doors on the planner's first screen: taller, with the icon above the title. */
  a.adv-door { padding: 18px; display: flex; flex-direction: column; gap: 6px; min-height: 148px; }
  a.adv-door .ico { width: 24px; height: 24px; color: var(--c-advisor); }
  a.adv-door .ico svg { width: 24px; height: 24px; }
  a.adv-door .adv-card-title { font-size: 16px; }
  a.adv-door .muted { flex: 1 1 auto; }
  a.adv-door .adv-door-go { font-size: 13px; font-weight: 600; color: var(--c-advisor); }
  .adv-verdict { display: flex; gap: 14px; align-items: flex-start; }
  ul.adv-list { margin: 0; padding-left: 18px; line-height: 1.65; font-size: 14px; }
  ul.adv-list li { margin-bottom: 7px; }
  pre.cmd { font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; overflow-x: auto; margin: 6px 0; white-space: pre; }
  input[type="date"], input[type="datetime-local"] { color-scheme: light dark; }
  button, .btn { font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; min-height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background .12s; }
  button:hover, .btn:hover { background: var(--hover); }
  button.primary, .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button.primary:hover, .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink2); padding: 7px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--hover); }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 500; border-radius: 999px; padding: 2px 8px; background: var(--chip); color: var(--ink); line-height: 1.5; }
  .chip.ok { background: var(--ok-soft); color: var(--ok-text); } .chip.warn { background: var(--warn-soft); color: var(--warn-text); } .chip.info { background: var(--accent-soft); color: var(--accent-text); }
  /* A refused value (one no measurement can have) is marked in the colour of a refusal, not of a QC warning. */
  .chip.bad { background: linear-gradient(rgba(255, 59, 48, .13), rgba(255, 59, 48, .13)), var(--card); color: var(--danger); }
  @supports (color: color-mix(in srgb, red, red)) { .chip.bad { background: color-mix(in srgb, var(--danger) 13%, var(--card)); } }
  tr.refused td { background: rgba(255, 59, 48, .05); }
  @supports (color: color-mix(in srgb, red, red)) { tr.refused td { background: color-mix(in srgb, var(--danger) 5%, transparent); } }
  #testFields input.invalid, .rgrid input.invalid { border-color: var(--danger); background: linear-gradient(rgba(255, 59, 48, .07), rgba(255, 59, 48, .07)), var(--input); }
  @supports (color: color-mix(in srgb, red, red)) { #testFields input.invalid, .rgrid input.invalid { background: color-mix(in srgb, var(--danger) 7%, var(--input)); } }
  /* The results grid: narrow cells and lined-up digits, so a column reads like the sheet it was copied from. */
  .rgrid table { width: auto; } .rgrid td { padding: 3px 8px; } .rgrid th, .rgrid td { padding-right: 18px; }
  .rgrid input.gcell { width: 88px; min-height: 26px; padding: 3px 7px; text-align: right; font-variant-numeric: tabular-nums; }
  .note { padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg2); font-size: 13px; margin: 6px 0; }
  .note.warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn-text); }
  .note.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok-text); }
  /* A window that only shows the records, as LNP Lab is open in another window (app/main.js): the banner at the head of every screen, in view
     when scrolling, below the storage note when both show. It turns to the warning colours when a change was refused. */
  .windowNote { position: sticky; top: 8px; z-index: 49; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; background: var(--accent-soft); border-color: transparent; color: var(--accent-text); box-shadow: var(--shadow); }
  .windowNote > span { flex: 1 1 260px; }
  .windowNote button:disabled { opacity: .6; cursor: progress; }
  #storageNote + .windowNote { position: static; }
  .muted { color: var(--ink2); font-size: 12px; }
  .muted.small { font-size: 11.5px; line-height: 1.45; margin: 6px 0 0; max-width: 46em; }
  .card h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); margin: 12px 0 6px; }
  label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
  label.inline select { font-size: 12px; padding: 3px 6px; }
  .advanced { display: none; } body.mode-advanced .advanced { display: block; } body.mode-advanced tr.advanced { display: table-row; } body.mode-advanced td .advanced, body.mode-advanced span.advanced { display: inline; }
  details.advanced { display: none; } body.mode-advanced details.advanced { display: block; }
  body.mode-advanced .simpleOnly { display: none; } input.advanced { display: none; } body.mode-advanced input.advanced { display: inline-block; }
  .stub { border: 1px dashed var(--ink3); border-radius: 10px; padding: 14px 16px; color: var(--ink2); background: var(--card); }
  svg .ax { stroke: var(--line-strong); } svg .lb { fill: var(--ink2); font-size: 11px; }
  .fig { margin: 0; min-width: 0; } .fig-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; } .fig-head b { flex: 1; }
  .fig-dl { display: inline-flex; gap: 4px; opacity: .55; transition: opacity .15s; } .fig:hover .fig-dl, .fig-dl:focus-within { opacity: 1; }
  .fig-dl button { font-size: 11px; padding: 2px 7px; min-height: 0; }
  .fig figcaption { font-size: 12px; margin-top: 4px; }
  .fig-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); margin-bottom: 4px; } .fig-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* "At the bench" on the formulation record (app/ui/formulation.js): the volumes and pump flows to measure out

  .benchHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }

  @media (max-width: 860px) { .benchTiles { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); } .benchStep { flex-basis: 100%; } }

  /* The Formulations list: a group per experiment that folds away, and the filter above them. */

  @supports (color: color-mix(in srgb, red, red)) { #editForm input.invalid { background: color-mix(in srgb, var(--danger) 7%, var(--input)); } }
  .editRuns { width: auto; } .editRuns td { padding: 3px 8px; }

  /* Folds (Design & results, Optimizer): a section shown as one line that states its conclusion until it is

  details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 10px; }
  details.fold > summary::-webkit-details-marker { display: none; }

    border-right: 1.6px solid var(--ink2); border-bottom: 1.6px solid var(--ink2); transform: rotate(-45deg); transition: transform .14s ease; }
  details.fold[open] > summary::before { transform: rotate(45deg); }

  table.egrid { width: auto; } table.egrid td.egTd { padding: 3px 6px; vertical-align: top; text-align: right; }
  table.egrid input.ecell { width: 116px; min-height: 26px; padding: 3px 7px; text-align: right; font-variant-numeric: tabular-nums; }
  table.egrid input.ecell[data-stored]::placeholder { color: var(--ink2); opacity: .55; font-style: italic; }

  /* Spec 9.4: the troubleshooting assistant (app/ui/trouble.js). A cause the context rules out is greyed. */

  label.tsSym { display: flex; align-items: center; gap: 8px; cursor: pointer; } label.tsSym .adv-card-title { margin: 0; }
  .egGo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

  /* Measurements (app/ui/measurements.js): the Due card leads, a line per experiment and stage with its buttons;

  .dueActs { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .dueActs button, button.dueMore { padding: 3px 9px; min-height: 0; font-size: 12.5px; }
  button.dueMore { margin-top: 6px; }
  button.dueN { display: inline; padding: 0; min-height: 0; border: 0; background: none; font: inherit; color: var(--accent);
    text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; cursor: pointer; }
  .dueNames { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 4px 10px; } .dueNames code { font-size: 12px; }
  .waitBar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .waitBar label.inline { margin: 0; } .waitBar > select { width: auto; max-width: 100%; }

  #waitNames { margin-top: 8px; }
  .resBar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 8px; }

  .resBar select, .resBar input[type="search"] { width: auto; max-width: 100%; min-height: 28px; padding: 4px 8px; } .resBar #resExp { max-width: 260px; }
  .resBar input[type="search"] { width: 160px; } .resBar label.inline { margin: 0; }

  .resPager button { padding: 3px 10px; min-height: 0; font-size: 12.5px; }
  /* Design & results: the data sheet and the analysis on the left, the figure pinned on the right while the page scrolls. */

  .wsp.nopin { grid-template-columns: minmax(0, 1fr); }

  .wsp-pin { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; max-height: calc(100vh - 24px); overflow: auto; }

  .hbars { display: grid; gap: 3px; font-size: 12px; }
  .hbar { display: grid; grid-template-columns: 92px 1fr 40px; gap: 6px; align-items: center; color: var(--ink); text-decoration: none; }
  a.hbar:hover .hb i { opacity: 1; } .hbar .hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .hbar .hn { text-align: right; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .hbar .hb { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; display: block; position: relative; }
  .hbar .hb i { display: block; height: 100%; background: var(--accent); opacity: .8; border-radius: 5px; }
  .hbar .hb.two i { height: 50%; } .hbar .hb.two i.b, .swatch.b { background: var(--s2, #c96); }
  .hbar.comp.ok .hb i { background: var(--ok, #3a8); } .hbar.comp.warn .hb i { background: var(--warn); } .hbar.comp.bad .hb i { background: var(--bad, #c44); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); vertical-align: middle; margin: 0 4px 0 10px; }

  .crumbs ol { display: flex; flex-wrap: wrap; gap: 2px 0; list-style: none; margin: 0; padding: 0; }

  .crumbBack[disabled] { opacity: .35; }

<body>
<div class="app">
  <nav id="nav" aria-label="Main navigation"></nav>
  <main id="main"></main>
</div>
<script>
  // Apply the saved theme before the first paint to avoid a flash.
  try { const t = localStorage.getItem('lnp-lab.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script type="module" src="./app/main.js" onerror="window.__lnpLoadError = true"></script>
<script>
  // Startup watchdog: if nothing has rendered a few seconds after load, say why instead of leaving the page blank.
  // It checks the modules app/main.js imports statically (missing files, merge-conflict markers, HTML instead of JS)
  // and shows the errors the browser reported; screens loaded later are reported by the router itself.
  (function () {
    var errs = [];
    function onError(e) { errs.push((e.message || 'error') + (e.filename ? ' — ' + String(e.filename).replace(location.origin + '/', '') + (e.lineno ? ':' + e.lineno : '') : '')); }
    function onReject(e) { var r = e.reason; errs.push('Unhandled: ' + (r && r.stack ? String(r.stack).split('\n').slice(0, 2).join(' · ') : String(r))); }
    window.addEventListener('error', onError, true);
    window.addEventListener('unhandledrejection', onReject);
    function started() { var nav = document.getElementById('nav'), main = document.getElementById('main'); return !!(window.__lnpStarted || nav.children.length || main.textContent.trim()); }
    function resolve(dir, rel) {
      var base = rel.charAt(0) === '/' ? rel.slice(1) : dir + rel, out = [], parts = base.split('/');
      for (var i = 0; i < parts.length; i++) { if (parts[i] === '..') out.pop(); else if (parts[i] && parts[i] !== '.') out.push(parts[i]); }
      return out.join('/');
    }
    function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    async function diagnose() {
      if (started()) { window.removeEventListener('error', onError, true); window.removeEventListener('unhandledrejection', onReject); return; }
      var lines = [], seen = {}, queue = ['app/main.js'], version = '?';
      try {
        while (queue.length) {
          var p = queue.shift(); if (seen[p]) continue; seen[p] = true;
          var r;
          try { r = await fetch(p, { cache: 'no-store' }); } catch (e) { lines.push(p + ': cannot be fetched (' + e.message + ')'); continue; }
          if (!r.ok) { lines.push(p + ': HTTP ' + r.status + (r.status === 404 ? ' — the file is missing in the served folder' : ' — the server refused the file')); continue; }
          var t = await r.text();
          if (p === 'app/main.js') { var m = /APP_VERSION\s*=\s*['"]([^'"]+)['"]/.exec(t); if (m) version = m[1]; }
          if (/^(<<<<<<< |=======$|>>>>>>> )/m.test(t)) lines.push(p + ': contains git merge-conflict markers (<<<<<<<), so the last pull did not complete');
          else if (/^\s*</.test(t)) lines.push(p + ': the server returned HTML instead of JavaScript');
          var dir = p.slice(0, p.lastIndexOf('/') + 1), re = /\b(?:import|export)\s*(?:[\w*\s{},$]+?\s*from\s*)?['"]([^'"]+)['"]/g, im;
          while ((im = re.exec(t))) { var spec = im[1]; if (/^\.{0,2}\//.test(spec) && /\.m?js$/.test(spec)) queue.push(resolve(dir, spec)); }
        }
      } catch (e) { lines.push('check aborted: ' + e.message); }
      if (started()) return; // the app came up while we were looking
      var rank = function (l) { return /: HTTP \d|conflict|returned HTML|cannot be fetched/.test(l) ? 0 : /Uncaught|Unhandled/.test(l) ? 1 : 2; };
      var uniq = [], all = lines.concat(errs);
      for (var i = 0; i < all.length; i++) if (all[i] !== 'error' && uniq.indexOf(all[i]) < 0) uniq.push(all[i]);
      uniq.sort(function (a, b) { return rank(a) - rank(b); });
      var fileProblem = lines.length > 0, isFile = location.protocol === 'file:', isTauri = /^tauri:|^asset:/.test(location.protocol) || location.hostname === 'tauri.localhost';
      var staleCache = !fileProblem && errs.some(function (l) { return /does not provide an export|Importing binding name/.test(l); }); // link errors: new and old module versions mixed
      var advice = isFile ? 'The page was opened from the file system. Browsers block modules there: start the server with <code>npm start</code> in the app folder and open <code>http://localhost:8787/</code>.'
        : isTauri ? 'The bundled files are incomplete: rebuild with <code>npm run dist</code> and <code>npm run tauri build</code>.'
        : staleCache ? 'All files on the server are intact, so the browser most likely combined old cached modules with new ones. Reload with Cmd+Shift+R (hard reload) or empty the cache; the included server (<code>npm start</code>) prevents this.'
        : 'In the app folder, run <code>git status</code> and <code>git log -1 --oneline</code>. A pull that stopped halfway is repaired with <code>git fetch origin main &amp;&amp; git reset --hard FETCH_HEAD</code> (discards local edits to tracked files), then reload.';
      document.getElementById('main').innerHTML = '<div class="note warn" style="margin:24px"><b>LNP Lab did not start</b> (files for version ' + esc(version) + ' at ' + esc(location.href.split('#')[0]) + ').' +
        (uniq.length ? '<ul style="margin:8px 0 0 18px">' + uniq.map(function (l) { return '<li style="font-family:ui-monospace,Menlo,monospace;font-size:12px">' + esc(l) + '</li>'; }).join('') + '</ul>' : '<div>No broken file found; the error is in the browser console (Chrome: Cmd+Option+J, Safari: Cmd+Option+C).</div>') +
        '<div style="margin-top:10px">' + advice + ' Send this message with the report.</div></div>';
    }
    setTimeout(diagnose, 3000);
  })();
</script>
</body>
